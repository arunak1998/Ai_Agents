[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "An agentic AI travel planner: researches live data with tools, then writes a structured itinerary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.0",
    "pandas>=2.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.1.0",
    "requests>=2.31.0",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
